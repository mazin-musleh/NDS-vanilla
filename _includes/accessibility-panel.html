{%- comment -%}
Panel opens this FAB: it is one of its toggles. The button is also the only
accessibility markup a page carries — there is no <script> tag. nds-loader.js
arms this selector from a capture-phase listener and fetches
nds-accessibility.min.js on the first press, so the tiles are wired before the
panel is shown. It ships `hidden` — nds-fab.js strips that once the button is
routed into its dock. Drop this include and nothing is ever fetched.

The panel itself ships nowhere in this page's HTML — nds-accessibility.js
carries its markup (panelMarkup() in _js/nds-accessibility.js) and builds it
into a <template> on arm (saved prefs or FAB press), same as a page-authored
<template> would be. See components/accessibility.md for the markup reference.

To reposition: set data-panel-side HERE, on this button (not 'end'|'start'|
'top' on the panel — the panel no longer ships in HTML to carry it).
resolvePanel() reads it off the FAB and threads it into the built panel, so
this one attribute is the single control point. Set data-fab-pos below to
match by hand either way — the FAB docks before the panel is built, so
`auto` can't read the side back off it. A page-authored <template
class="nds-panel-template"><aside id="ndsAccessibilityPanel"> still wins
over the built-in markup if you need more than repositioning.
{%- endcomment -%}
<button class="nds-btn nds-primary nds-circle nds-icon-only nds-fab nds-accessibility-toggle"
        type="button"
        aria-label="Accessibility settings"
        data-i18n-attr="aria-label:panel_label"
        aria-controls="ndsAccessibilityPanel"
        aria-expanded="false"
        data-fab-pos="auto"
        data-panel-side="end"
        data-panel-toggle="ndsAccessibilityPanel"
        data-accessibility-toggle
        hidden>
    <i class="nds-icon nds-hgi-accessibility" aria-hidden="true"></i>
</button>

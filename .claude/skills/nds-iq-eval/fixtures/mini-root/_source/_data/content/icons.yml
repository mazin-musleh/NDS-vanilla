# fixture catalog stub — UI icons registered in the inline set (.nds-icon.nds-hgi-*)
#
# Must list every nds-hgi-* name that appears in fixture markup. Only registered
# names paint: an unregistered one is a silent solid box, and NDS.Init.audit()
# reports it. So a name used in markup and missing here is a real defect an agent
# will correctly flag — about a page that is fine, costing the run's attention on
# a fault of the harness. (nds-hgi-menu-01 did exactly that on 2026-08-10.)
hgi:
  - nds-hgi-arrow-left-01
  - nds-hgi-arrow-right-01
  - nds-hgi-search-01
  - nds-hgi-copy-01
  - nds-hgi-menu-01

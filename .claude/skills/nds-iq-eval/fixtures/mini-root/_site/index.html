<!DOCTYPE html>
<html dir="ltr" lang="en" data-theme="light">
<head>
    <!-- fixture head unit: stands in for the real sequenced head; copy as a unit -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NDS Fixture Home</title>
    <link rel="icon" href="assets/img/favicon.svg">
    <link rel="preload" href="assets/css/nds-critical.min.css" as="style">
    <link rel="stylesheet" href="assets/css/nds-critical.min.css">
    <link rel="stylesheet" href="assets/css/nds-main.min.css">
    <script>/* fixture theme guard */document.documentElement.dataset.themeGuard="1";</script>
</head>
<body>
    <header class="nds-topbar"><div class="nds-brand"><img class="nds-brand-logo" src="assets/img/logo.svg" alt="Entity"><span class="nds-brand-name">Entity Name</span></div></header>
    <main>
        <div class="nds-content-layout">
            <div class="nds-main-content">
                <section class="nds-content-section">
                    <div class="nds-section-wrapper">
                        <div class="nds-section-head"><span class="nds-section-title">Sample Section</span></div>
                        <div class="nds-section-body"><p>Sample content.</p></div>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <footer class="nds-footer"><p>Sample footer</p></footer>
    <script defer src="assets/js/nds-main.min.js"></script>
    <script defer src="assets/js/nds-accessibility.min.js"></script>

</html>

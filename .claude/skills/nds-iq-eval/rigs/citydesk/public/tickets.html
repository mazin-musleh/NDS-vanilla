<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets - CityDesk Staff</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.11/css/dataTables.bootstrap5.min.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="index.html">
      <img src="img/logo.svg" width="40" height="40" alt="CityDesk logo" class="me-2">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="submit.html">Submit a Request</a></li>
        <li class="nav-item"><a class="nav-link" href="tickets.html">Staff: Tickets</a></li>
      </ul>
      <form class="d-flex me-3" role="search" id="navSearchForm">
        <input class="form-control" type="search" id="navSearch" placeholder="Search CityDesk..." aria-label="Search">
      </form>
      <ul class="navbar-nav align-items-center">
        <li class="nav-item me-3">
          <a class="nav-link position-relative" href="#" id="notifBell">
            <i class="bi bi-bell fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              3
              <span class="visually-hidden">unread notifications</span>
            </span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link btn-city-outline px-3 rounded" href="/sso/login">Sign In</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid py-4">
  <h1 class="h3 mb-3">Ticket Queue</h1>

  <div class="tickets-toolbar">
    <div class="row g-3 align-items-center">
      <div class="col-auto">
        <div class="fw-bold mb-1">Status</div>
        <div class="btn-group" role="group" aria-label="Filter by status" id="statusToggle">
          <button type="button" class="btn btn-outline-secondary status-toggle active" data-status="">All</button>
          <button type="button" class="btn btn-outline-secondary status-toggle" data-status="open">Open</button>
          <button type="button" class="btn btn-outline-secondary status-toggle" data-status="pending">Pending</button>
          <button type="button" class="btn btn-outline-secondary status-toggle" data-status="closed">Closed</button>
        </div>
      </div>
      <div class="col-auto">
        <div class="fw-bold mb-1">Department</div>
        <div class="btn-group flex-wrap" role="group" aria-label="Filter by department" id="deptToggle">
          <button type="button" class="btn btn-outline-secondary dept-toggle active" data-dept="">All</button>
          <button type="button" class="btn btn-outline-secondary dept-toggle" data-dept="Water &amp; Utilities">Water &amp; Utilities</button>
          <button type="button" class="btn btn-outline-secondary dept-toggle" data-dept="Roads &amp; Transport">Roads &amp; Transport</button>
          <button type="button" class="btn btn-outline-secondary dept-toggle" data-dept="Parks &amp; Recreation">Parks &amp; Recreation</button>
          <button type="button" class="btn btn-outline-secondary dept-toggle" data-dept="Permits &amp; Licensing">Permits &amp; Licensing</button>
          <button type="button" class="btn btn-outline-secondary dept-toggle" data-dept="Waste Management">Waste Management</button>
        </div>
      </div>
    </div>
  </div>

  <p><span id="resultCount">Loading...</span></p>

  <table id="ticketsTable" class="table table-striped table-bordered nowrap">
    <thead>
      <tr>
        <th>Ticket ID</th>
        <th>Subject</th>
        <th>Department</th>
        <th>Status</th>
        <th>Created</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="text-center my-4">
    <button type="button" class="btn btn-city" id="loadMoreBtn">Load more tickets</button>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.11/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.11/js/dataTables.bootstrap5.min.js"></script>
<script src="js/site.js"></script>
<script src="js/tickets.js"></script>
</body>
</html>

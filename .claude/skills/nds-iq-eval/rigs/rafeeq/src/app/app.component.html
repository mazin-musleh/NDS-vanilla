<div class="app-root" [dir]="lang.dir()">
  <a class="skip-link" href="#main-content">{{ t().common.skip }}</a>

  <mat-sidenav-container class="app-shell">
    <mat-sidenav #drawer mode="over" class="app-drawer" [attr.aria-label]="t().header.menu">
      <div class="drawer-brand">{{ lang.code() === 'ar' ? 'رفيق' : 'Rafeeq' }}</div>
      <mat-nav-list>
        @for (link of links; track link.path) {
          <a
            mat-list-item
            [routerLink]="link.path"
            routerLinkActive
            #rla="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: link.exact }"
            [activated]="rla.isActive"
            (click)="drawer.close()"
          >
            <mat-icon matListItemIcon>{{ link.icon }}</mat-icon>
            <span matListItemTitle>{{ t().nav[link.key] }}</span>
          </a>
        }
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="app-content">
      <app-header (menuClick)="drawer.toggle()" />
      <main id="main-content" class="app-main" tabindex="-1">
        <router-outlet />
      </main>
      <app-footer />
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>المكتبة العامة — الفعاليات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">المكتبة العامة</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">الرئيسية</a></li>
                    <li class="nav-item"><a class="nav-link" href="/catalog.html">الفهرس</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/events.html">الفعاليات</a></li>
                    <li class="nav-item"><a class="nav-link" href="/booking.html">حجز القاعات</a></li>
                    <li class="nav-item"><a class="nav-link" href="/account.html">حسابي</a></li>
                    <li class="nav-item"><a class="nav-link" href="/contact.html">اتصل بنا</a></li>
                </ul>
                <form class="d-flex ms-3" action="/catalog.html" method="get">
                    <input class="form-control form-control-sm" type="search" name="q" placeholder="ابحث في الفهرس...">
                    <button class="btn btn-light btn-sm ms-2" type="submit">بحث</button>
                </form>
                <span id="authArea"></span>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1 class="mb-1">فعاليات المكتبة</h1>
        <p class="text-muted mb-4">انشطة وورش ولقاءات مفتوحة للجميع، اغلبها مجاني بالتسجيل المسبق.</p>

        <div class="btn-group mb-4" id="filterButtons" role="group">
            <button type="button" class="btn btn-outline-success active" data-cat="">الكل</button>
            <button type="button" class="btn btn-outline-success" data-cat="ثقافي">ثقافي</button>
            <button type="button" class="btn btn-outline-success" data-cat="ورشة">ورش</button>
            <button type="button" class="btn btn-outline-success" data-cat="نادي">نوادي</button>
            <button type="button" class="btn btn-outline-success" data-cat="معرض">معارض</button>
        </div>

        <div class="row g-3" id="eventsList"></div>
    </main>

    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container d-flex justify-content-between flex-wrap">
            <span>المكتبة العامة — شارع الثقافة، حي المعرفة</span>
            <span>الدوام: السبت الى الخميس، 8 صباحا الى 9 مساء</span>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function renderAuth() {
            var m = document.cookie.match(/(?:^|; )lib_user=([^;]+)/);
            if (m) {
                $('#authArea').html('<span class="text-light ms-3">' + decodeURIComponent(m[1]) +
                    '</span> <a class="btn btn-outline-light btn-sm" href="/sso/logout?return=/events.html">خروج</a>');
            } else {
                $('#authArea').html('<a class="btn btn-outline-light btn-sm ms-3" href="/sso/login?return=/events.html">دخول الاعضاء</a>');
            }
        }

        var allEvents = [];

        function renderEvents(cat) {
            var list = cat ? allEvents.filter(function (e) { return e.category === cat; }) : allEvents;
            var html = '';
            list.forEach(function (e) {
                html += '<div class="col-md-4"><div class="card h-100"><div class="card-body">' +
                    '<span class="badge bg-success mb-2">' + e.category + '</span>' +
                    '<h5 class="card-title">' + e.title + '</h5>' +
                    '<p class="card-text text-muted">' + e.desc + '</p>' +
                    '<small class="text-muted">التاريخ: ' + e.date + '</small>' +
                    '</div></div></div>';
            });
            $('#eventsList').html(html || '<p class="text-muted">لا فعاليات في هذا التصنيف حاليا.</p>');
        }

        $(function () {
            renderAuth();
            $.getJSON('/api/events', function (evs) {
                allEvents = evs;
                renderEvents('');
            });
            $('#filterButtons button').on('click', function () {
                $('#filterButtons button').removeClass('active');
                $(this).addClass('active');
                renderEvents($(this).data('cat'));
            });
        });
    </script>
</body>
</html>

  description: "تخطيط تحريري للمحتوى الطويل بأقسام على نمط المقالات وأقسام فرعية مرقّمة وفهرس محتويات ثابت داخل الصفحة للتنقل فيها."

- url: "/templates/help-support-template.html"
  title: "قالب المساعدة والدعم"
  description: "مركز مساعدة بواجهة فرعية مسطحة وشبكة متجاوبة من بطاقات قنوات الدعم، لكل منها أيقونة مميزة ووصف وأوقات التوفر ومدة الاستجابة."

- url: "/templates/about-entity-template.html"
  title: "قالب عن الجهة"
  description: "مركز صفحات الجهة بواجهة فرعية مسطحة وشبكة متجاوبة من بطاقات المواضيع، لكل منها أيقونة مميزة وعنوان وسهم تنقل."

- url: "/templates/faq-template.html"
  title: "قالب الأسئلة الشائعة"
  description: "تخطيط للأسئلة الشائعة بواجهة فرعية مسطحة وقائمة أكورديون كبيرة وبطاقة دعوة لإبداء الرأي توجّه الاستفسارات غير المحلولة إلى الدعم."

- url: "/templates/e-participation-template.html"
  title: "قالب المشاركة الإلكترونية"
  description: "مركز مواضيع المشاركة بواجهة فرعية وشبكة متجاوبة من أربعة أعمدة من بطاقات تنقل نصية فقط لنقاط دخول مشاركة المواطنين."

- url: "/templates/social-media-template.html"
  title: "قالب وسائل التواصل الاجتماعي"
  description: "مركز قنوات التواصل الاجتماعي بواجهة فرعية مسطحة وشبكة متجاوبة من بطاقات المنصات، لكل منها أيقونة مميزة واسم وسهم تنقل."

- url: "/templates/kpis-template.html"
  title: "قالب مؤشرات الأداء"
  description: "لوحة أداء تجمع بين بطاقات عدّادات المؤشرات ومخططات دائرية وحلقية وخطية وأعمدة، وجداول بيانات متجاوبة لإحصاءات البوابة والخدمات."

- url: "/templates/search-template.html"
  title: "قالب البحث"
  description: "تخطيط نتائج البحث باستعلام في العنوان، وقوائم منسدلة للتصفية والفرز، وقائمة بطاقات مرقّمة الصفحات."

- url: "/templates/404-template.html"
  title: "قالب صفحة 404"
  description: "صفحة خطأ مخصصة برسم توضيحي وإجراء للعودة إلى الصفحة الرئيسية."

- url: "/examples/student-portal.html"
  title: "بوابة الطالب"
  description: "الصفحة الرئيسية للطالب بالدرجات وحصص اليوم والطلبات والاختبارات والخدمات."

- url: "/examples/services-list.html"
  title: "قائمة الخدمات"
  description: "دليل خدمات حكومية قابل للتصفية، مع بحث ومرشحات حسب الفئة."

- url: "/examples/sign-in.html"
  title: "تسجيل الدخول"
  description: "تسجيل دخول وطني موحد مع بديل بالبيانات، ورمز لمرة واحدة، وإعدادات الحساب."

- url: "/examples/faculty-cv.html"
  title: "السيرة الذاتية لعضو هيئة التدريس"
  description: "ملف أكاديمي طويل بفهرس محتويات، وخط زمني للمسيرة المهنية، والمؤهلات، والمنشورات مرقّمة الصفحات."

- url: "/examples/program.html"
  title: "البرنامج الأكاديمي"
  description: "صفحة برنامج دراسي بمحتوى قابل للتوسيع، والخطة الدراسية، ومعلومات القبول."

- url: "/examples/manage-records.html"
  title: "إدارة السجلات"
  description: "شاشة سجلات بالإنشاء والتعديل والحذف، ومرشحات، وصفوف تفاصيل قابلة للتوسيع، وتصدير CSV."

- url: "/examples/console-demo.html"
  title: "لوحة التحكم"
  description: "لوحة تحكم إدارية بمخططات ومعاملات ودليل للفريق وإشعارات."

- url: "/examples/job-apply.html"
  title: "التقديم على وظيفة"
  description: "إعلان وظيفة مع طلب التقديم في الصفحة نفسها: الدور الوظيفي ثم نموذج طويل في مجموعات، يختار لكل حقل نوعه بحسب نوع الإجابة."

- url: "/examples/track-request.html"
  title: "متابعة طلبي"
  description: "طلب واحد أرسله المستخدم: سجله، وما يلزمه الآن، والرد النهائي، في أربع حالات."

- url: "/examples/events.html"
  title: "تقويم الفعاليات"
  description: "صفحة فعاليات وزارة: فعالية مميزة بعدّاد تنازلي، والفعاليات في Calendar بالأسبوع أو الشهر، والحجز في لوحة واحدة مشتركة."

- url: "/examples/book-appointment.html"
  title: "حجز موعد"
  description: "حجز زيارة في صفحة واحدة، تظهر أقسامها بالترتيب المعتاد في مواقع الحجز: الخدمة والفرع، ثم اليوم وبجانبه الأوقات المتاحة، ثم بياناتك، مع ملخص حي يتحكم في زر الحجز."

- url: "/examples/open-data.html"
  title: "البيانات المفتوحة"
  description: "صفحة مجموعة بيانات واحدة بترتيب بوابات البيانات المفتوحة: ما هي البيانات، والسجلات في جدول أو مخطط، وقاموس البيانات، والملفات، وواجهة API، وطريقة الاستشهاد، مع الحقائق ومجموعات البيانات ذات الصلة بجانبها."

- url: "/examples/news-article.html"
  title: "الخبر الصحفي"
  description: "خبر واحد بالترتيب المعتاد في المواقع الإخبارية: سطر المؤلف تحت العنوان، ونص مع اقتباس ومعرض صور، ثم Share والكاتب، وبجانبه الأخبار ذات الصلة والأكثر قراءة، ثم مزيد من الأخبار."

- url: "/examples/account-settings.html"
  title: "إعدادات الحساب"
  description: "حساب مستخدم مسجل الدخول في تبويبات من صفوف هادئة: لكل إعداد صف بقيمته وزر تغيير، وكل تغيير في Modal صغيرة، ويؤكّد البريد الإلكتروني أو الجوال الجديد برمز."

- url: "/examples/support-inbox.html"
  title: "صندوق رسائل الدعم"
  description: "رسائل مستخدم مسجل الدخول تقرأ كالخطابات: تبويبا الوارد والمرسل، وصفوف غير مقروءة، ولوحة واحدة للقراءة والرد، ولوحة لكتابة رسالة جديدة."

- url: "/events/national-day-96.html"
  title: "اليوم الوطني 96"
  description: "غيّر مظهر الموقع كاملاً لليوم الوطني السعودي بوسم script واحد: الواجهة الرسمية للحملة بست شرائح، وأشرطة الهوية أسفل كل قسم، وتذييل بسمة المناسبة، في الوضعين الفاتح والداكن."

- url: "/events/foundation-day.html"
  title: "يوم التأسيس"
  description: "غيّر مظهر الموقع كاملاً ليوم التأسيس السعودي بوسم script واحد: لوحة ألوان بنية تراثية وشريحة واجهة ثنائية اللغة قابلة للضبط، في الوضعين الفاتح والداكن."

- url: "/events/hajj.html"
  title: "الحج"
  description: "غيّر مظهر الموقع كاملاً لموسم الحج بوسم script واحد: واجهة بخط سعودي، وخلفية تتبع اتجاه الصفحة، وإبرازات موسمية للأقسام، في الوضعين الفاتح والداكن."

# Component catalog for homepage listing
# Categories:    Foundations (icons, themes, tokens) · UI · Forms · Data · Add-ons
#                (optional bundles) · UI Shell (page chrome) · Layout · Core (the
#                runtime's own API: things you CALL, with no markup of their own) ·
#                Utilities (small helpers you APPLY to markup)
#   The category groups the index cards and the side menu. It does not have to match
#   the page's directory: Cookies is Utilities at /components/, Clock is UI Shell at
#   /ui-shell/. Recategorising alone changes no URL; moving the file does, so weigh
#   that against who already links to the old path.
# Tags (tech):   JS, CSS, API, Data
# Tags (status): Experimental, New, Beta, Deprecated
#   Color a status tag via the object form: { name: "Beta", style: "nds-yellow" }
# Tags (kind):   Add-on (optional bundle, gated by a site.* flag)

- title: "Accessibility"
  description: "Site-wide panel for accessibility presets, typography tuning, and visual filters"
  use_when: "The dev asks for an accessibility widget, a11y toolbar, font-size controls, high contrast mode, colour-blind filters, or a WCAG preferences panel. Site-wide floating panel, shipped as an optional add-on bundle gated by a site flag."
  icon: '<i class="hgi hgi-stroke hgi-accessibility"></i>'
  category: "Add-ons"
  tags: ["JS", "CSS", "Add-on", "API"]
  url: "/components/accessibility.html"
  js: _js/nds-accessibility.js
  scss: _sass/components/_accessibility.scss


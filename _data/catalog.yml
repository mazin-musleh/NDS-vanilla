- title: "Date"
  description: "Show, parse, print and convert dates in Gregorian and Hijri (Umm al-Qura), in the site's timezone and date format"
  use_when: "Read a date from text, print a date, convert between Gregorian and Hijri, or get today's date in the site's timezone. Use it for any date handled in JavaScript, to show a <time> in Hijri with data-date-calendar (an issue or expiry date in both calendars), and to set the site's timezone and date format on <html>. For a date field the user fills in use Date Picker; to sort a list by date use Sort."
  category: "Core"
  tags: ["JS", "API"]
  url: "/core/date.html"
  js: _js/nds-date.js

- title: "Init"
  description: "Starts every component at load, and the calls that tell them a container changed"
  use_when: "Page code must wait until the components on the page have started, or you added, removed, or replaced rows, cards, or list items with JavaScript and the filters, counters, or controls around them are now stale. One call updates every affected component instead of calling each one with its own argument. Reach for it on any CRUD screen, after an AJAX list swap, or whenever content arrives after page load. Server-driven lists are deliberately left alone."
  category: "Core"
  tags: ["JS", "API"]
  url: "/core/init.html"
  js: _js/nds-loader.js

- title: "Internationalization"
  description: "The text NDS components write, in one file per language that the page loads and a site can change or extend"
  use_when: "Change the text a component writes (a message, a button label, a screen reader label), add a language, or give your own component text in the page's language. The page's language comes from lang on <html>. For dates in the page's language use Date."
  category: "Core"
  tags: ["JS", "API"]
  url: "/core/i18n.html"
  js: _js/nds-core.js

- title: "Request"
  description: "Fetch wrapper with a timeout, a response size cap, and errors you can branch on"
  use_when: "Call an API from the browser: a fetch wrapper applying a timeout, a response size cap, and a status check, handing back parsed JSON or raw text with errors you can branch on. Use it anywhere you would reach for fetch. NDS components never fetch for you; wire data through this."
  category: "Core"
  tags: ["JS", "API"]
  url: "/core/request.html"
  js: _js/nds-core.js


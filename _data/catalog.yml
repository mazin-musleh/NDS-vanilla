# NDS catalog: every library page, template, example and event pack, one entry each.
# Not here: the Get Started and NDS IQ guides (setup, not parts; llms.txt links them),
#   and the two Life Journey sub-pages, which the hub's use_when names.
# The home page, /components/ (Library), /templates/, /examples/, /events/, llms.txt
# and the SEO meta all read this one file.
#
# Shelf = the first folder of `url` (foundations, layout, ui-shell, components,
#   utilities, core, guides, templates, examples, events). There is no shelf field,
#   so it cannot drift from where the page lives. Place a new library page by the
#   first yes: read it, not use it → guides · call it from JavaScript, no markup of
#   its own → core · a value every part reads → foundations · at most one per page,
#   serving the whole page → ui-shell · only arranges other parts, no look of its
#   own → layout · a class or attribute that tweaks markup you wrote, drawing
#   nothing of its own → utilities · everything else → components.
#   Moving a page changes its URL; the 404 page forwards an old URL by file name,
#   so keep the file name when you move it.
# category: the group inside the shelf. Components: Actions · Navigation · Overlays
#   · Feedback · Content · Forms · Data. Any other library shelf: the shelf's own
#   name. Templates and examples: Service · Form · Content · Dashboard. Events: Theme.
#   It feeds the Library filter, the card tags, the side menu and llms.txt.
#
# Order: the Library list sorts its cards A–Z by title itself. Everywhere else, file
#   order is display order, here and in _data/sidemenu/sidemenu.yml. Inside a library
#   shelf or Components group, A–Z by title; the side menu goes A–Z by its label,
#   except Foundations, Layout and UI Shell, which it curates. Templates, examples and
#   events are curated, newest showcase first, and the side menu lists them in the
#   same order as here.
#
# use_when: match a request against THIS field first, not against the title. Titles
#   name the subject; use_when names the JOB the entry does, in the words developers
#   use for it. Never conclude NDS lacks something until every use_when here has
#   been read. A template is a DGA-official page, so a match there outranks a
#   hand-composed page or an example. use_when renders nowhere on the site.
#
# Tags (tech):   JS, CSS, API, Data
# Tags (status): Experimental, New, Beta, Deprecated
#   Color a status tag via the object form: { name: "Beta", style: "nds-yellow" }
# Tags (kind):   Add-on (optional bundle, gated by a site.* flag)
#   Templates and examples tag the components they show; templates add DGA.
# new: true      shows a "New" tag on a template or example card.
# js: / scss:    a library entry's own source files. Both are absent on a container
#                page whose behavior belongs to entries of its own: Top Bar (Clock,
#                Weather Widget and DGA Digital Stamp each carry their own js:),
#                Hero (the slider is Swiper's markup), Document Head (script tags
#                and preloads, no component JS). A JS tag with no js: is that case,
#                not a missing value. Two entries may share one file (Numbers,
#                Counter Animation and Currency all point at _js/nds-numbers.js).
# icon:          template, example and event cards only; library entries carry none.
#                Keep every value distinct and registered in _sass/_hgiRoundedStroke.scss.
# thumbnail / theme (events): the card image, and the _data/themes.yml value that
#                drives the live Preview button. Each event also ships a switcher entry
#                in _data/themes.yml and a folder under docs-assets/events/<event>/.

# ── Foundations — values every part reads ─────────────────────────────────

- title: "Icons"
  description: "Outline icons from the HugeIcons library, as a font with the full library for page content and a smaller built-in set for interface controls"
  use_when: "How icons work here: the HugeIcons font for page content, plus the curated inline SVG set for components and chrome, with sizing, colour, and licence guidance. Read before adding any icon."
  category: "Foundations"
  tags: ["CSS"]
  url: "/foundations/icons.html"

- title: "Themes"
  description: "Light and dark mode, plus brand theming: generate a full palette from OKLCH seed colours, or override the design tokens with a stylesheet theme"
  use_when: "Light and dark mode, plus brand theming: generate a full palette from OKLCH seed colours, or override the design tokens with a stylesheet. Read this before applying any brand colour."
  category: "Foundations"
  tags: ["CSS", "JS"]
  url: "/foundations/themes.html"
  js: _js/nds-theme.js

- title: "Tokens"
  description: "The CSS custom properties behind NDS: the color palette, size scales, semantic meanings and component tokens, with a preview of each"
  use_when: "The CSS custom properties behind NDS: the color palette, size scales, semantic meanings and component tokens. Read this before writing any hardcoded colour, spacing, or radius value."
  category: "Foundations"
  tags: ["CSS"]
  url: "/foundations/tokens.html"

# ── Layout — arranges other parts ─────────────────────────────────────────

- title: "Block"
  description: "Spacing unit for content and components, with an optional title"
  use_when: "Space out the parts of a section body. Put it straight on a block component such as a stepper, tab set, or table to give it the standard gap, or wrap paragraphs, lists, and tables that belong together under one optional heading. Use when content needs separation, or a heading, but not its own Section."
  category: "Layout"
  tags: ["CSS"]
  url: "/layout/block.html"
  scss: _sass/layout/_block.scss

- title: "Flex"
  description: "Quick alignment, direction, and wrapping with custom-property overrides"
  use_when: "Quick alignment, direction, and wrapping without writing CSS: row or column layouts, centering, spacing between items."
  category: "Layout"
  tags: ["CSS"]
  url: "/layout/flex.html"
  scss: _sass/layout/_flex.scss

- title: "Grid"
  description: "Responsive column system with flexible breakpoints"
  use_when: "A responsive column layout: card grids, two, three, or four column sections, breakpoint-driven column counts. The default for laying out repeated items."
  category: "Layout"
  tags: ["CSS", "JS"]
  url: "/layout/grid.html"
  scss: _sass/_grid.scss
  js: _js/nds-grid.js

- title: "Page Layout"
  description: "The body structure every page shares, with the classes that switch chrome shape"
  use_when: "Build the page skeleton before any content: the body structure, the chrome regions, and the classes that switch between the home, content page, minimal, and console shapes. Read this when you start a new page, pick a chrome shape, or mount a framework app inside NDS markup. It also covers the two ways a page gets its chrome: a layout injects the header, hero, and footer, or the page writes them itself. For a whole page in one file, copy the Home Page Template."
  category: "Layout"
  tags: ["CSS"]
  url: "/layout/page-layout.html"
  scss: _sass/layout/_content-layout.scss

- title: "Prose"
  description: "Default styling for classless flowing content from editors and CMSs"
  use_when: "Style classless HTML you do not control: CMS output, rich text editor content, markdown, imported articles. Wrap it once and the headings, paragraphs, lists, quotes, and tables inside read correctly."
  category: "Layout"
  tags: ["CSS"]
  url: "/layout/prose.html"
  scss: _sass/layout/_prose.scss

- title: "Section"
  description: "Page content sections with head, body, and action areas"
  use_when: "The wrapper every page region uses, with head, body, and action areas. Read this before building any page: all NDS page content sits inside sections."
  category: "Layout"
  tags: ["CSS"]
  url: "/layout/section.html"
  scss: _sass/layout/_section.scss

- title: "Status Section"
  description: "Whole-page or inline outcome message with a status icon, a title, and one action"
  use_when: "Report one outcome on its own page or as a section: page not found, 404, 500, access denied, no permission, sign in required, request submitted, thank-you or confirmation page, payment failed, order received, form sent. A centered icon or illustration over a title, a short message, and a way out. For a message inside a form or a page region use Alert; for a status icon on its own use Feedback Icons. For a full 404 or error page, copy the 404 Template."
  category: "Layout"
  tags: ["CSS"]
  url: "/layout/status-section.html"
  scss: _sass/layout/_section-layout.scss


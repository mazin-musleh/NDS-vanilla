- title: "Account Settings"
  description: "A signed-in user's settings in tabs: contact details, password, two-step sign-in, devices, notifications and deleting the account."
  use_when: "A page where a signed-in user changes their own account: profile, account settings, preferences, security, notification settings, privacy and data. One area per Tab with an icon (nds-divided). Inside a panel, each group is an nds-block with a block title. Facts from a government record are a Definition List with a line that says where to change them, never fields. Several fields saved together are a data-ajax form with a Save button and a toast. A Switch applies at once with no Save button, and turns back with field feedback if the request fails. A new password uses the Password field with rule chips and a retype field (data-password-match), plus a hidden username field for password managers. Signed-in devices are a compact Table with a Sign out button on each row. Deleting the account asks first in a Modal. The page runs NDS.SessionTimeout.init() and hides the hero's Share. For a signed-in home page, see the Student Portal."
  icon: '<i class="hgi hgi-stroke hgi-user-settings-01"></i>'
  category: "Form"
  tags: ["Tabs", "Switch", "Password", "Definition List", "Session Timeout"]
  url: "/examples/account-settings.html"
  new: true

- title: "Support Inbox"
  description: "A signed-in user's messages, read like letters: Inbox and Sent tabs, unread rows, one panel to read and reply, and a panel to write a new message."
  use_when: "A page of messages between a user and a government body: an inbox, notifications with replies, support tickets, official letters, messages from a service. Inbox and Sent are Tabs, and the Inbox label carries the unread count. Each message is a Drawer row (a button) with a featured icon, a New tag while unread, a preview line and a Meta line (sender, time). Every row opens ONE shared Panel that a page script fills from the row (a real site loads the message by its id); opening marks it read. A message people can answer has a reply form in the panel; an automatic one shows an info Alert that says where to ask instead. New message opens a second Panel with a form: Custom Select for the topic, a Textarea, and an Upload in Button mode. An empty list is an Empty placeholder (nds-empty with data-empty-message) that leaves when a row is added. The page runs NDS.SessionTimeout.init(). Not a chat: for live back-and-forth, see the parked Chat component; for dated events in a panel, the Events Calendar."
  icon: '<i class="hgi hgi-stroke hgi-mail-open-01"></i>'
  category: "Service"
  tags: ["Drawer", "Panel", "Tabs", "Empty", "Session Timeout"]
  url: "/examples/support-inbox.html"
  new: true


# Hero Slider Configuration
# ─────────────────────────
# Each slide supports:
#   src:        Background image path (required) — used above 1646px
#   src_small:  Mobile background image path — used up to 768px
#   src_mid:    Optional mid-size image — used from 769px to 1646px
#   overlay:    Background overlay opacity (0-1, default: 0.7)
#   position:   Background image position (default: "center center")
#   class:      Custom CSS class added to the slide
#
# Default content (title/description/button):
#   title:       Slide heading
#   description: Slide paragraph
#   url:         "Read More" button link (omit or "#" to hide button)
#
# Custom content (replaces default title/description/button):
#   content: |
#     <img src="{relative_url}/assets/img/logo.svg" alt="Logo">
#     <h1 class="nds-section-title">Custom Title</h1>
#     <p class="nds-section-description">Custom text</p>
#   Only the first slide takes <h1>; later slides use <h2>.
#
#
#   Use {relative_url} for any paths — resolves to site baseurl (works from any page).

- src: assets/img/riyadhcenter_IQ.webp
  src_small: assets/img/riyadhcenter_IQ_sm.webp
  src_mid: assets/img/riyadhcenter_IQ_md.webp
  overlay: 0.6
  position: 20% 50%
  content: |
    <h1 class="nds-section-title">Vanilla Design System</h1>
    <p class="nds-section-description" style="max-width:550px;">An open-source, vanilla implementation of Saudi Arabia's National Design System. Production-ready HTML, CSS, and JavaScript built from scratch with zero dependencies.</p>
    <div class="nds-section-action">
      <a href="{relative_url}/guides/get-started.html" class="nds-btn nds-primary nds-oncolor nds-md"><i class="hgi hgi-stroke hgi-artificial-intelligence-04"></i><span class="nds-label">Get Started</span></a>
      <a href="https://github.com/mazin-musleh/NDS-vanilla" target="_blank" rel="noopener" class="nds-btn nds-secondary-outline nds-oncolor nds-md nds-external"><i class="hgi hgi-stroke hgi-github"></i><span class="nds-label">View on GitHub</span></a>
    </div>


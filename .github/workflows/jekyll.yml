# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch. The ignore list mirrors the
  # `exclude:` entries in _config.yml — files Jekyll never copies into _site,
  # so a push touching only these can't change what's deployed. Gemfile* and
  # .github/workflows/ stay out of it: they change the build itself.
  push:
    branches: ["main"]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'SECURITY.md'
      - 'LICENSE'
      - 'CLAUDE.md'
      - 'AGENTS.md'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/CODEOWNERS'
      - '.github/FUNDING.yml'
      - '.github/dependabot.yml'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.gitignore'
      - 'standard-page.md'
      - 'subsite.md'
      - 'TODO.md'

  # Publishing a release moves the site root to the new tag.
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      rebuild_release:
        description: 'Rebuild the release site instead of reusing the saved copy'
        type: boolean
        default: false

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job — the site root is the latest release tag, /next/ is main.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Find the latest release
        id: release
        run: echo "tag=$(gh release view --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Name the saved release site
        # One saved build per tag + NDS IQ revision; a new release, an IQ edit or a forced rebuild misses it.
        id: key
        run: echo "prefix=release-site-${{ steps.release.outputs.tag }}-${{ hashFiles('_includes/NDS-IQ.md', 'guides/integration-quality.md') }}-" >> "$GITHUB_OUTPUT"
      - name: Restore the saved release site
        id: saved
        if: ${{ !inputs.rebuild_release }}
        uses: actions/cache/restore@v4
        with:
          path: _site
          key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.327.0
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.3' # Bundler 2.7+ requires Ruby >= 3.2
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Release site: only when nothing was restored.
      - name: Checkout the latest release
        if: ${{ !steps.saved.outputs.cache-matched-key }}
        # Underscore folder: Jekyll skips it when building main.
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: _release
      - name: Take NDS IQ from main
        # IQ versions apart from the template: the site shows the rules the raw main link serves.
        if: ${{ !steps.saved.outputs.cache-matched-key }}
        run: cp _includes/NDS-IQ.md _release/_includes/ && cp guides/integration-quality.md _release/guides/
      - name: Setup Ruby (release)
        if: ${{ !steps.saved.outputs.cache-matched-key }}
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
          working-directory: _release
      - name: Build the release at the root
        if: ${{ !steps.saved.outputs.cache-matched-key }}
        working-directory: _release
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" -d ../_site
        env:
          JEKYLL_ENV: production
      - name: Save the release site
        # Before the /next/ build, so the saved copy holds the release only.
        if: ${{ !steps.saved.outputs.cache-matched-key }}
        uses: actions/cache/save@v4
        with:
          path: _site
          key: ${{ steps.key.outputs.prefix }}${{ github.run_id }}

      - name: Build main at /next/
        # preview: true marks every page noindex (_includes/seo-meta.html).
        run: |
          echo 'preview: true' > "$RUNNER_TEMP/next.yml"
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}/next" --config "_config.yml,$RUNNER_TEMP/next.yml" -d _site/next
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
